[workspace]
resolver = "3"
members = ["ludo-core", "ludo-game", "server"]
default-members = ["server"]

[workspace.package]
edition = "2024"
version = "0.2.1"
# Bevy 0.20 needs at least this.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prasenjit-net/ludo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ludo-core = { path = "ludo-core" }

# Keep dev builds of dependencies (Bevy) reasonably fast.
[profile.dev.package."*"]
opt-level = 2

# The board texture is painted on startup; keep that quick in dev builds too.
[profile.dev.package.ludo-game]
opt-level = 2

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

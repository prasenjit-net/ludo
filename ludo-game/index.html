<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ludo</title>
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <style>
      :root {
        --bg: #1e1e24; --panel: #2a2a33; --text: #f2f0ea; --muted: #a09da8; --accent: #f2b138;
        --Red: #d93a3a; --Green: #33b34d; --Yellow: #f2cc33; --Blue: #3366d9;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 16px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 1fr 300px; height: 100%; }
      #board { min-width: 0; min-height: 0; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 14px;
        min-height: 0; overflow: auto; }
      @media (max-width: 760px), (max-aspect-ratio: 1/1) {
        #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
        #hud { max-height: 42vh; }
      }
      h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
      h2 { margin: 0 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
      button { font: inherit; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
        background: #44444f; color: var(--text); }
      button:hover:not(:disabled) { background: #55555f; }
      button.primary { background: var(--accent); color: #1b1b1f; font-weight: 600; }
      button.primary:hover:not(:disabled) { background: #f7c15f; }
      button:disabled { opacity: .45; cursor: default; }
      input { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid #55555f;
        background: #1e1e24; color: var(--text); width: 100%; }
      .row { display: flex; gap: 8px; align-items: center; }
      .seg button { flex: 1; } .seg button.on { background: var(--accent); color: #1b1b1f; font-weight: 600; }
      .overlay { position: fixed; inset: 0; background: rgba(15,15,18,.92); display: none;
        align-items: center; justify-content: center; padding: 16px; z-index: 10; overflow: auto; }
      .overlay.show { display: flex; }
      .card { background: var(--panel); border-radius: 14px; padding: 24px; width: min(460px, 100%);
        display: flex; flex-direction: column; gap: 18px; }
      .card section { display: flex; flex-direction: column; gap: 10px; }
      .error { color: #ff8c8c; min-height: 1.4em; }
      .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px;
        vertical-align: -2px; border: 2px solid #0006; }
      .plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .plist li { padding: 6px 10px; border-radius: 8px; background: #1e1e24; }
      .plist li.turn { outline: 2px solid var(--accent); }
      .plist li.off { opacity: .5; }
      .code { font-size: 44px; font-weight: 700; letter-spacing: 8px; text-align: center; color: var(--accent); }
      #die { width: 76px; height: 76px; border-radius: 14px; background: #f5f3ee; color: #1b1b1f;
        display: grid; place-items: center; font-size: 46px; font-weight: 700; }
      #status { font-weight: 600; min-height: 2.8em; }
      #log { margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px;
        display: flex; flex-direction: column; gap: 3px; flex: 1; min-height: 40px; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="board"><canvas id="canvas"></canvas></div>
      <aside id="hud">
        <h1>LUDO</h1>
        <div>
          <h2 id="room-label" hidden></h2>
          <ul class="plist" id="players"></ul>
        </div>
        <div class="row">
          <div id="die">–</div>
          <button class="primary" id="roll" disabled>Roll dice</button>
        </div>
        <div id="status"></div>
        <ul id="log"></ul>
        <div class="error" id="hud-error"></div>
        <button id="to-menu">Leave game</button>
      </aside>
    </div>

    <div class="overlay show" id="menu">
      <div class="card">
        <h1>LUDO</h1>
        <section>
          <h2>Same screen</h2>
          <div class="row seg" id="local-count">
            <button data-n="2">2 players</button><button data-n="3">3 players</button><button class="on" data-n="4">4 players</button>
          </div>
          <button class="primary" id="start-local">Start game</button>
        </section>
        <section>
          <h2>Online</h2>
          <input id="name" placeholder="Your name" maxlength="16" />
          <div class="row seg" id="online-count">
            <button data-n="2">2</button><button data-n="3">3</button><button class="on" data-n="4">4</button>
          </div>
          <button class="primary" id="create">Create room</button>
          <div class="row">
            <input id="code" placeholder="Room code" maxlength="4" style="text-transform: uppercase" />
            <button id="join">Join</button>
          </div>
        </section>
        <div class="error" id="menu-error"></div>
      </div>
    </div>

    <div class="overlay" id="lobby">
      <div class="card">
        <h2>Room code: share it with your friends</h2>
        <div class="code" id="lobby-code"></div>
        <ul class="plist" id="lobby-players"></ul>
        <div id="lobby-wait" style="color: var(--muted)"></div>
        <button id="lobby-leave">Leave</button>
      </div>
    </div>

    <div class="overlay" id="over">
      <div class="card">
        <h1 id="over-text"></h1>
        <button class="primary" id="over-menu">Back to menu</button>
      </div>
    </div>

    <script>
      // Bridge to the wasm game (see ludo-game/src/bridge.rs).
      let queue = [];
      const send = (cmd) => queue.push(cmd);
      window.ludoDrain = () => { const q = JSON.stringify(queue); queue = []; return q; };

      const $ = (id) => document.getElementById(id);
      const DICE = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
      const dot = (c) => `<span class="dot" style="background: var(--${c})"></span>`;
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      function segmented(id) {
        const el = $(id);
        el.addEventListener("click", (e) => {
          if (!e.target.dataset.n) return;
          el.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.target));
        });
        return () => Number(el.querySelector(".on").dataset.n);
      }
      const localCount = segmented("local-count");
      const onlineCount = segmented("online-count");
      const name = () => $("name").value.trim();

      $("start-local").onclick = () => send({ cmd: "local", players: localCount() });
      $("create").onclick = () => send({ cmd: "create", name: name(), players: onlineCount() });
      $("join").onclick = () => send({ cmd: "join", name: name(), code: $("code").value });
      $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("join").click(); });
      $("roll").onclick = () => send({ cmd: "roll" });
      for (const id of ["to-menu", "lobby-leave", "over-menu"]) $(id).onclick = () => send({ cmd: "menu" });
      addEventListener("keydown", (e) => {
        if (e.code === "Space" && !$("roll").disabled && e.target.tagName !== "INPUT") {
          e.preventDefault(); send({ cmd: "roll" });
        }
      });

      // Deep link: #local2, #local3 or #local4 starts a same-screen game straight away.
      const deep = /^#local([234])$/.exec(location.hash);
      if (deep) send({ cmd: "local", players: Number(deep[1]) });

      function playerList(el, s, withTurn) {
        el.innerHTML = s.players.map((p, i) => {
          const cls = [withTurn && i === s.turn && s.winner == null ? "turn" : "", p.connected ? "" : "off"].join(" ");
          const tag = (i === s.you ? " (you)" : "") + (p.connected ? "" : " — left");
          return `<li class="${cls}">${dot(p.color)}${esc(p.name)}${tag}</li>`;
        }).join("");
      }

      window.ludoRender = (json) => {
        const s = JSON.parse(json);
        $("menu").classList.toggle("show", s.screen === "menu");
        $("lobby").classList.toggle("show", s.screen === "lobby");
        $("over").classList.toggle("show", s.screen === "game" && s.winner != null);
        $("menu-error").textContent = s.screen === "menu" ? (s.error || "") : "";
        $("hud-error").textContent = s.screen === "game" ? (s.error || "") : "";

        if (s.screen === "lobby") {
          $("lobby-code").textContent = s.room;
          playerList($("lobby-players"), s, false);
          const missing = s.capacity - s.players.length;
          $("lobby-wait").textContent = `Waiting for ${missing} more player${missing === 1 ? "" : "s"}…`;
          $("lobby-players").insertAdjacentHTML("beforeend",
            Array(missing).fill('<li class="off">Waiting…</li>').join(""));
        }
        if (s.screen === "game") {
          $("room-label").hidden = !s.online;
          $("room-label").textContent = `Room ${s.room}`;
          playerList($("players"), s, true);
          $("die").textContent = s.dice ? DICE[s.dice] : "–";
          $("roll").disabled = !s.can_roll;
          $("status").textContent = s.status;
          $("log").innerHTML = s.log.slice(-8).map((l) => `<li>${esc(l)}</li>`).reverse().join("");
          if (s.winner != null) {
            $("over-text").innerHTML = `${dot(s.players[s.winner].color)}${esc(s.players[s.winner].name)} wins!`;
          }
        }
      };
    </script>
  </body>
</html>

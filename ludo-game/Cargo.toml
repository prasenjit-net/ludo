[package]
name = "ludo-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ludo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy = { version = "0.20", default-features = false, features = ["2d", "ui"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "WebSocket", "MessageEvent", "CloseEvent", "Event", "Storage"] }
